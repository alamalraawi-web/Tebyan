<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#0876d9" />

  <title>تبيان - النظام الصحي الذكي</title>
</head>

<body>
  <div id="root"></div>

  <script>
    // منع Ctrl + عجلة الماوس
    window.addEventListener(
      "wheel",
      function (event) {
        if (event.ctrlKey) {
          event.preventDefault();
        }
      },
      { passive: false }
    );

    // منع اختصارات التكبير والتصغير في لوحة المفاتيح
    window.addEventListener("keydown", function (event) {
      if (
        (event.ctrlKey || event.metaKey) &&
        (
          event.key === "+" ||
          event.key === "-" ||
          event.key === "=" ||
          event.key === "0"
        )
      ) {
        event.preventDefault();
      }
    });

    // منع بعض إيماءات التكبير على الأجهزة التي تدعم gesture events
    document.addEventListener(
      "gesturestart",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );

    document.addEventListener(
      "gesturechange",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );

    document.addEventListener(
      "gestureend",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
